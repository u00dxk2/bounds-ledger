name: reverify
on:
  schedule:
    - cron: "17 9 * * *" # daily 09:17 UTC (03:17 MT)
  workflow_dispatch:
  push:
    branches: [main]
  # b1, 2026-08-17. Without this a feature branch got ZERO runs however often it was pushed, so a
  # branch held pending a runner verdict had no path to one except a `workflow_dispatch --ref` that
  # nobody remembers exists — and `guard-catch-count` duly sat unvalidated for a day with an
  # innocuously blank branch page. A hold whose release condition has no executable command
  # outlives its reason.
  #
  # Worth knowing WHICH sha this validates, because it fixes a second defect for free: a
  # `pull_request` run checks out the MERGE commit (`refs/pull/N/merge`), not the branch tip. That
  # is exactly the sha we care about. On 2026-08-17 a dispatch validated a branch tip that could
  # never have landed — main had moved and both sides had fixed the same lines differently — so the
  # verdict was about code that would not exist. A merge-commit run cannot make that mistake.
  #
  # One run per PR, not per push, so this REPLACES manual dispatches rather than adding load. That
  # matters here: each run issues ~450 requests and two dispatches in ten minutes tripped
  # raw.githubusercontent secondary rate limiting today.
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # A-7 R18. The dependency set is empty, so this installs nothing today — which is exactly
      # the point: `npm ci` fails on a package.json/lockfile mismatch, so the day someone adds a
      # package it must arrive with its lockfile entry or CI stops. A ratchet is cheapest to fit
      # while there is nothing to ratchet.
      - name: Install from the lockfile (frozen)
        run: npm ci
      - name: Self-test drift detection (no network)
        run: node scripts/reverify.test.mjs
      - name: Self-test claim matcher (no network)
        run: node scripts/check-claims.mjs --selftest
      # This step existed in `npm test` but NOT here for six days, so the extractor that
      # generates 218 of the ledger's 227 claims was unguarded in CI — a self-test that
      # passes locally and is never executed by the alarm is the lane's founding defect
      # (an alarm that isn't armed carries no information) turned on itself. A-8.
      - name: Self-test pin extractor (no network)
        run: node scripts/extract-pins.mjs --selftest
      # Guards the brief checker's verdict branching — specifically that a page which is NOT
      # the brief (sign-in wall, wrong port) reports UNVERIFIABLE instead of blaming the
      # orchestrator's re-port, and that adding that gate did not swallow the stale verdict.
      - name: Self-test brief checker (no network)
        run: node scripts/check-brief.mjs --selftest
      # Guards the SECRET-PATTERN SET, not the sweep itself. The sweep is a one-time pre-flip
      # gate (A-13) and stays out of CI; the scheduled history-sweep control is A-7's R7, which
      # is fleet-owned and must not be solved locally ahead of that wave. But the patterns rot
      # silently — two of them could not fire at all in this file's first draft while the sweep
      # still printed CLEAN — so the fixture set is guarded here.
      - name: Self-test history-sweep patterns (no network)
        run: node scripts/history-sweep.mjs --selftest
      # Guards the G-2 gap-table value parser: numeric cells must parse (rightmost
      # literal), symbolic/exponent cells must stay null, and an inverted gap must
      # flag parseSuspect (instrument error, never a mathematical claim).
      - name: Self-test gap-table parser (no network)
        run: node scripts/gap-table.mjs --selftest
      # Guards the G-2 27b certificate verifier (search/27b): exact planarity
      # (DMP) and exact chromatic number, proven both ways — nonplanar graphs
      # fire, planar stay silent, chi exact on five known graphs, one good
      # certificate passes and three defect classes fail.
      - name: Self-test 27b certificate verifier (no network)
        run: node search/27b/selftest.mjs
      # Guards the G-2 27b PROPOSAL-ROUND gates (search/27b/propose-round.mjs).
      # Each of the four gates must fire on a graph that trips it and stay
      # silent on one that does not, the split search must return BOTH of its
      # outcomes, and Sulanke's graph must re-certify at target 9 — so a gate
      # that silently starts eliminating everything (or nothing) fails CI
      # instead of quietly emptying the campaign's search space.
      - name: Self-test 27b proposal-round gates (no network)
        run: node search/27b/propose-round.mjs --selftest
      # Guards the G-2 27b ROUND-TWO grower (search/27b/round2-grow.mjs), which
      # builds biplanar graphs BY CONSTRUCTION. The danger here is a grower that
      # quietly stops being biplanar while the search keeps reporting numbers,
      # so the self-test checks its output against the independent verifier AND
      # proves that same verifier rejects a corrupted partition and a nonplanar
      # layer — a construction argument must never be the only thing standing
      # behind a result. Also pins seed-reproducibility.
      - name: Self-test 27b round-two grower (no network)
        run: node search/27b/round2-grow.mjs --selftest
      # Guards the G-2 27b ROUND-THREE seeded search (search/27b/round3-seeded.mjs).
      # Two instruments, both dangerous if they drift silently. (1) The edge-budget
      # test decides family members WITHOUT a search, so it must stay silent on
      # Sulanke's own graph (which is biplanar) and fire on K7+C5 (which is one edge
      # over) — a budget test that flagged the record would close the family by
      # arithmetic error. (2) The seeded grower must actually HOLD its seed: the
      # self-test asserts every one of the 50 seed edges survives into the union and
      # that a corrupted seed partition is REJECTED rather than quietly grown around,
      # since a grower that dropped the design would report round two's numbers under
      # round three's name. Chromatic numbers are computed, never taken from the
      # r+3 join formula.
      - name: Self-test 27b round-three seeded search (no network)
        run: node search/27b/round3-seeded.mjs --selftest
      # Guards the W-6 traffic sampler's MERGE, which is the only part of it that can destroy
      # data. GitHub keeps 14 days; continuity/traffic.json is the only copy of everything
      # older, so a merge that returned just the incoming window would silently delete the
      # record we are sampling in order to build. The sampler itself never runs in CI (it needs
      # a credential `gh` holds locally, and this repo is public — no traffic token goes in
      # repo secrets); only the merge logic is guarded here.
      - name: Self-test traffic sampler merge (no network)
        run: node scripts/traffic-snapshot.mjs --selftest
      # The generator that keeps README's "Current state" honest. Its selftest proves BOTH
      # answers — no-op on a current block, fires on a stale sha AND a stale count — because a
      # generator that cannot go red silently agrees with whatever is already written, which is
      # the exact failure it exists to prevent (KP-78 / W-4).
      - name: Self-test README state-block generator (no network)
        run: node scripts/render-state-block.mjs --selftest
      # Guards the catches-per-week indicator's ONE judgment: which claims.json edits count as
      # a record moving. Fixtures, not git history — `actions/checkout` is depth-1, so a
      # history-walking self-test would pass locally and be untestable here, which is the
      # test-it-from-the-environment-that-runs-it rule. The indicator itself never runs in CI:
      # it renders a figure and no verdict, so there is nothing for a build to fail on.
      - name: Self-test catch-rate indicator (no network)
        run: node scripts/catch-rate.mjs --selftest
      # Not piped and deliberately network-free: this asserts README's published figures still
      # match COMMITTED repo state. A stale block is a falsifiable public error on the front
      # page of a repo whose pitch is that it notices stale numbers.
      - name: Check README state block matches committed state
        run: node scripts/render-state-block.mjs --check
      # `shell: bash` is load-bearing: the DEFAULT runner shell is `bash -e {0}` with NO
      # pipefail, so `node ... | tee` reports tee's exit 0 and a drift exits GREEN. Naming
      # the shell gets `-eo pipefail`. Guarded by reverify.test.mjs.
      - name: Check adopted surface for drift
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # 2>&1 is load-bearing: reverify.mjs reports tool errors via console.error, and a bare
        # `| tee` captures only stdout — so a transient `error: fetch failed` reached the CI log
        # but NEVER the issue body, producing an alarm that fired with no stated reason (A-5).
        run: node scripts/reverify.mjs --check 2>&1 | tee -a finding.txt
      - name: Check ledger claims across cited surfaces
        if: '!cancelled()'
        shell: bash
        run: node scripts/check-claims.mjs 2>&1 | tee -a finding.txt
      # The report is terminal text (console.log). Two fixes here, from the 2026-07-24
      # peak-moment render read (docs/findings/2026-07-24-peak-moment-render.md):
      #   P-1  the TITLE names what drifted — else every alarm is titled by date alone and
      #        carries no signal (recognition over recall).
      #   fence  the BODY goes in a ``` block — GFM otherwise eats the report's -/+ diff into
      #        nested bullets, destroying which value is old vs new, and italicises the $..$ nums.
      # shell: bash is load-bearing (pipes below need pipefail); guarded by reverify.test.mjs.
      - name: Open finding
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # finding.txt only exists once the drift/claims steps have RUN. If a self-test
          # failed, the job is red but there is no check output — file an honestly-titled
          # instrument-failure issue rather than dying at `cat` (which filed nothing at all,
          # leaving the alarm silent about its own breakage). A-4, found 2026-07-25 by
          # executing this step's body rather than reading it.
          if [ -s finding.txt ]; then
            parts=$(grep -hE '^(CHANGED|ADDED|REMOVED) ' finding.txt | sed -E 's/^[A-Z]+ //' | paste -sd', ' - || true)
            if [ -z "$parts" ]; then
              parts=$(grep -hE '^(BROKEN|UNREACHABLE) ' finding.txt | awk '{print $2}' | paste -sd', ' - || true)
              [ -n "$parts" ] && parts="claims $parts"
            fi
            if [ -n "$parts" ]; then
              title="Drift: $parts ($(date -u +%F))"
            elif grep -qE '^error:' finding.txt; then
              # A tool error is NOT a drift. Titling it "Drift:" asserts a record moved when
              # none did — and a reader who opens it finds every claim holding, which reads as
              # contradictory and trains us to ignore the alarm. A-5, caught in production
              # 2026-07-25 by a transient `error: fetch failed` filing issue #2.
              title="Check error: bounds-ledger re-verification could not complete ($(date -u +%F))"
            else
              title="Re-verification failed: bounds-ledger ($(date -u +%F))"
            fi
            body=$(cat finding.txt)
          else
            title="Instrument failure: bounds-ledger self-test ($(date -u +%F))"
            body='(no check output — the job failed before the drift/claims steps ran; see the failed step above)'
          fi
          title=${title:0:240}
          # ponytail: finding.txt is our own tool output and never contains ```, so a plain fence is safe.
          { printf '```\n'; printf '%s\n' "$body"; printf '```\n'; } > issue-body.md
          gh issue create \
            --title "$title" \
            --body-file issue-body.md \
            --repo "$GITHUB_REPOSITORY"

  # Separate job, and it ALWAYS exits 0. The hosted brief is ported to the site by the
  # orchestrator, not by this repo, so a stale page must not turn the ledger's drift alarm red
  # — G-1's green streak measures the LEDGER, and a permanently-red alarm carries exactly as
  # much information as a permanently-green one (this lane's founding defect).
  #
  # But `npm run check` is a MANUAL invocation, and a check nobody runs is not a check: it sat
  # in npm-only wiring for one commit before this. The page had been stale since 26 July and
  # two hand-checks missed half of it. So it runs daily on its own and SURFACES through an
  # issue rather than through an exit code nobody reads.
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check hosted brief is in sync with docs/lane-brief.md
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          node scripts/check-brief.mjs > brief.txt 2>&1
          code=$?
          set -e
          cat brief.txt
          if [ "$code" -eq 0 ]; then exit 0; fi
          if [ "$code" -eq 3 ]; then
            # exit 3 = the response was not the brief. From CI that is EXPECTED and permanent:
            # /t/* went behind a human sign-in wall on 2026-08-02, and CI holds no CC_PROMPTS_PIN,
            # so an unauthenticated runner can never see this page. Filing an issue for it would
            # create a permanently-open alarm that can never be closed by any action — which is
            # this lane's founding defect wearing a different hat. Same shape as C-7: the check is
            # simply not runnable from here, and the LOCAL `npm run check` is the authoritative
            # read. Deliberately NOT solved by putting the PIN in repo secrets: this repo is
            # heading for a public flip (A-13), and a portfolio-wide credential does not belong in
            # a soon-to-be-public repo's CI for a check a local run already covers.
            echo "brief check is not runnable from CI (no machine credential; /t/* is gated) — local \`npm run check\` is authoritative. Not filing an issue."
            exit 0
          fi
          if [ "$code" -ne 1 ]; then
            # exit 2 = the checker itself broke (fetch failed, brief format changed). That is an
            # instrument failure, not a stale brief, and must not be titled as one — A-5.
            title="Brief check could not complete: bounds-ledger"
          else
            title="Brief stale: hosted lane brief is behind docs/lane-brief.md"
          fi
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty' --repo "$GITHUB_REPOSITORY")
          if [ -n "$existing" ]; then
            echo "already open as #$existing — not duplicating (the issue is the standing alarm)"
            exit 0
          fi
          { printf '```\n'; cat brief.txt; printf '```\n'; } > brief-issue.md
          gh issue create --title "$title" --body-file brief-issue.md --repo "$GITHUB_REPOSITORY"
