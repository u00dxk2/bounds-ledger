name: reverify
on:
  schedule:
    - cron: "17 9 * * *" # daily 09:17 UTC (03:17 MT)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Self-test drift detection (no network)
        run: node scripts/reverify.test.mjs
      - name: Self-test claim matcher (no network)
        run: node scripts/check-claims.mjs --selftest
      # This step existed in `npm test` but NOT here for six days, so the extractor that
      # generates 218 of the ledger's 227 claims was unguarded in CI — a self-test that
      # passes locally and is never executed by the alarm is the lane's founding defect
      # (an alarm that isn't armed carries no information) turned on itself. A-8.
      - name: Self-test pin extractor (no network)
        run: node scripts/extract-pins.mjs --selftest
      # `shell: bash` is load-bearing: the DEFAULT runner shell is `bash -e {0}` with NO
      # pipefail, so `node ... | tee` reports tee's exit 0 and a drift exits GREEN. Naming
      # the shell gets `-eo pipefail`. Guarded by reverify.test.mjs.
      - name: Check adopted surface for drift
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # 2>&1 is load-bearing: reverify.mjs reports tool errors via console.error, and a bare
        # `| tee` captures only stdout — so a transient `error: fetch failed` reached the CI log
        # but NEVER the issue body, producing an alarm that fired with no stated reason (A-5).
        run: node scripts/reverify.mjs --check 2>&1 | tee -a finding.txt
      - name: Check ledger claims across cited surfaces
        if: '!cancelled()'
        shell: bash
        run: node scripts/check-claims.mjs 2>&1 | tee -a finding.txt
      # The report is terminal text (console.log). Two fixes here, from the 2026-07-24
      # peak-moment render read (docs/findings/2026-07-24-peak-moment-render.md):
      #   P-1  the TITLE names what drifted — else every alarm is titled by date alone and
      #        carries no signal (recognition over recall).
      #   fence  the BODY goes in a ``` block — GFM otherwise eats the report's -/+ diff into
      #        nested bullets, destroying which value is old vs new, and italicises the $..$ nums.
      # shell: bash is load-bearing (pipes below need pipefail); guarded by reverify.test.mjs.
      - name: Open finding
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # finding.txt only exists once the drift/claims steps have RUN. If a self-test
          # failed, the job is red but there is no check output — file an honestly-titled
          # instrument-failure issue rather than dying at `cat` (which filed nothing at all,
          # leaving the alarm silent about its own breakage). A-4, found 2026-07-25 by
          # executing this step's body rather than reading it.
          if [ -s finding.txt ]; then
            parts=$(grep -hE '^(CHANGED|ADDED|REMOVED) ' finding.txt | sed -E 's/^[A-Z]+ //' | paste -sd', ' - || true)
            if [ -z "$parts" ]; then
              parts=$(grep -hE '^(BROKEN|UNREACHABLE) ' finding.txt | awk '{print $2}' | paste -sd', ' - || true)
              [ -n "$parts" ] && parts="claims $parts"
            fi
            if [ -n "$parts" ]; then
              title="Drift: $parts ($(date -u +%F))"
            elif grep -qE '^error:' finding.txt; then
              # A tool error is NOT a drift. Titling it "Drift:" asserts a record moved when
              # none did — and a reader who opens it finds every claim holding, which reads as
              # contradictory and trains us to ignore the alarm. A-5, caught in production
              # 2026-07-25 by a transient `error: fetch failed` filing issue #2.
              title="Check error: bounds-ledger re-verification could not complete ($(date -u +%F))"
            else
              title="Re-verification failed: bounds-ledger ($(date -u +%F))"
            fi
            body=$(cat finding.txt)
          else
            title="Instrument failure: bounds-ledger self-test ($(date -u +%F))"
            body='(no check output — the job failed before the drift/claims steps ran; see the failed step above)'
          fi
          title=${title:0:240}
          # ponytail: finding.txt is our own tool output and never contains ```, so a plain fence is safe.
          { printf '```\n'; printf '%s\n' "$body"; printf '```\n'; } > issue-body.md
          gh issue create \
            --title "$title" \
            --body-file issue-body.md \
            --repo "$GITHUB_REPOSITORY"
